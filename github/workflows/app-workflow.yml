          package com.racexai.bot;
          
          import java.util.List;
          
          /**
           * Decides when to act on what it is shown. No Android imports, so the whole
           * sequence can be replayed against recorded frames on a desktop rather than
           * debugged on a phone.
           *
           * The loop, in the game's own terms:
           *
           *   BETTING opens with a readable board -> fill it into the app and announce.
           *           Only once per race: the board is re-read every frame while the
           *           countdown ticks, and re-filling every time would re-announce over
           *           and over.
           *   RACING  the board vanishes from the tree entirely - vehicle names included -
           *           so nothing can be re-read here. The app keeps what it was given.
           *   RESULT  "ORV won, Next 10 s" appears and stays about ten seconds. Log it
           *           once, then forget the board so the next round fills cleanly even if
           *           it happens to have the identical line-up.
           */
          public class RaceWatcher {
          
              public interface Listener {
                  /** cars left-to-right, road name, slot 1..3 as drawn on screen */
                  void fillAndSpeak(List<String> cars, String road, int slot);
                  /** live odds and crowd stake per vehicle, recorded alongside the race */
                  void raceMeta(List<String> odds, List<String> bets);
                  void logWinner(String winner);
              }
          
              private final Listener listener;
          
              private String filledKey;    // the board currently sitting in the app
              private boolean armed;       // that board has a race running on it
              private int filled = 0, logged = 0;
          
              public RaceWatcher(Listener listener) { this.listener = listener; }
          
              public int filledCount() { return filled; }
              public int loggedCount() { return logged; }
          
              public void feed(String dump) {
                  // Only frames showing the Lucky Race board count for anything.
                  if (dump.indexOf("race_game_bg") < 0 && dump.indexOf("gameBetView") < 0) return;
          
                  RaceReader.Frame f = RaceReader.parse(dump);
          
                  if (f.betOpen) {
                      if (f.cars.size() != 3 || f.road == null || f.slot < 1) return;   // half-drawn
                      String key = f.cars.toString() + "|" + f.road + "|" + f.slot;
                      if (key.equals(filledKey)) return;                                // same board, already done
                      filledKey = key;
                      armed = true;
                      filled++;
                      listener.fillAndSpeak(f.cars, f.road, f.slot);
                      listener.raceMeta(f.odds, f.bets);
                      return;
                  }
          
                  // racing or showing the result
                  if (f.winner != null && armed) {
                      armed = false;
                      filledKey = null;      // next board fills even if it is the same three cars
                      logged++;
                      listener.logWinner(f.winner);
                  }
              }
          }
