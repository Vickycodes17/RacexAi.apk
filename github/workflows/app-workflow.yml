          package com.racexai.bot;
          
          import android.accessibilityservice.AccessibilityService;
          import android.graphics.Rect;
          import android.os.SystemClock;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import android.view.accessibility.AccessibilityWindowInfo;
          
          import java.util.List;
          
          /**
           * Watches Chamet in the other half of the screen and drives the app.
           *
           * Reads every visible window rather than just the focused one, because in split
           * screen Chamet is deliberately NOT focused while the bot is - so the service
           * config needs flagRetrieveInteractiveWindows and getWindows() has to be used
           * instead of getRootInActiveWindow(), which would only ever return our own half.
           *
           * All the decisions live in RaceWatcher, which has no Android imports and is
           * tested against recorded frames. This class only turns the view tree into text
           * and passes the resulting instructions to the WebView.
           */
          public class WatchService extends AccessibilityService implements RaceWatcher.Listener {
          
              private static final long MIN_GAP_MS = 600;
          
              private static WatchService instance;
              private final RaceWatcher watcher = new RaceWatcher(this);
              private long last = 0;
          
              public static boolean isRunning() { return instance != null; }
              public static int filled() { return instance == null ? 0 : instance.watcher.filledCount(); }
              public static int logged() { return instance == null ? 0 : instance.watcher.loggedCount(); }
          
              @Override protected void onServiceConnected() { super.onServiceConnected(); instance = this; }
              @Override public void onDestroy() { if (instance == this) instance = null; super.onDestroy(); }
              @Override public void onInterrupt() { }
          
              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  long now = SystemClock.elapsedRealtime();
                  if (now - last < MIN_GAP_MS) return;
                  last = now;
          
                  StringBuilder sb = new StringBuilder();
                  List<AccessibilityWindowInfo> windows = null;
                  try { windows = getWindows(); } catch (Exception ignored) { }
                  if (windows == null) return;
          
                  for (AccessibilityWindowInfo w : windows) {
                      if (w == null) continue;
                      AccessibilityNodeInfo root = null;
                      try { root = w.getRoot(); } catch (Exception ignored) { }
                      if (root == null) continue;
                      CharSequence pkg = root.getPackageName();
                      // only the game's own window is worth walking
                      if (pkg != null && pkg.toString().indexOf("matemet") >= 0) walk(root, sb);
                      try { root.recycle(); } catch (Exception ignored) { }
                  }
          
                  if (sb.length() == 0) return;
                  try { watcher.feed(sb.toString()); } catch (Exception ignored) { }
              }
          
              /** Same one-line-per-node format RaceReader is written and tested against. */
              private void walk(AccessibilityNodeInfo n, StringBuilder sb) {
                  if (n == null) return;
                  String id = n.getViewIdResourceName();
                  CharSequence text = n.getText();
                  if (id != null) {
                      sb.append("* id=").append(id);
                      if (text != null && text.length() > 0) sb.append(" TEXT=\"").append(text).append('"');
                      Rect r = new Rect();
                      n.getBoundsInScreen(r);
                      sb.append(" [").append(r.left).append(',').append(r.top)
                        .append('-').append(r.right).append(',').append(r.bottom).append("]\n");
                  }
                  int kids = n.getChildCount();
                  for (int i = 0; i < kids; i++) {
                      AccessibilityNodeInfo c = n.getChild(i);
                      if (c != null) { walk(c, sb); try { c.recycle(); } catch (Exception ignored) { } }
                  }
              }
          
              // ---- what RaceWatcher decided ---------------------------------------
          
              @Override
              public void fillAndSpeak(List<String> cars, String road, int slot) {
                  String arr = arr(cars);
                  // fill first, then announce - the announcement reads the picks the fill
                  // produced, so speaking any earlier would voice the previous race
                  MainActivity.js("RaceAuto.fill(" + arr + ",\"" + esc(road) + "\"," + slot + ")");
                  MainActivity.js("RaceAuto.speak()");
              }
          
              @Override
              public void raceMeta(List<String> odds, List<String> bets) {
                  MainActivity.js("RaceAuto.meta(" + arr(odds) + "," + arr(bets) + ")");
              }
          
              @Override
              public void logWinner(String winner) {
                  MainActivity.js("RaceAuto.log(\"" + esc(winner) + "\")");
              }
          
              /** a JS array literal from a list of strings */
              private static String arr(List<String> list) {
                  StringBuilder sb = new StringBuilder("[");
                  if (list != null) for (int i = 0; i < list.size(); i++) {
                      if (i > 0) sb.append(',');
                      sb.append('"').append(esc(list.get(i))).append('"');
                  }
                  return sb.append(']').toString();
              }
          
              private static String esc(String s) {
                  return s == null ? "" : s.replace("\\", "\\\\").replace("\"", "\\\"");
              }
          }
