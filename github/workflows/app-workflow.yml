              echo '```'
              grep -E "FAILURE:|What went wrong|^> |error:|^e: |Caused by:" build.log | head -40
              echo '```'
            fi
          } >> $GITHUB_STEP_SUMMARY
          exit $CODE

      - name: Collect the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/RaceXAiBot.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RaceXAiBot-apk
          path: out/RaceXAiBot.apk
          if-no-files-found: error

      # A release gives a permanent link anyone can download from, without a
      # GitHub account - but ONLY while the repo is public. On a private repo the
      # link asks for a login, which defeats the point of sharing it.
      - name: Publish a shareable download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Race x AI Bot - latest
          body: |
            Tap RaceXAiBot.apk below to download and install.
            Allow "install from unknown sources" when Android asks.
          files: out/RaceXAiBot.apk
          make_latest: true
        continue-on-error: true      # a private repo can still build without it

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-build-log
          path: build.log
