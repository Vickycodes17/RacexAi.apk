name: Build APK

# Two files live in this repo: this workflow, and index.html (the app itself).
# They are separate because GitHub refuses to start a run for any workflow file
# over 500 KB, and index.html alone is 760 KB.
#
# Everything else - the Android project, the Java, the Gradle config - is written
# out below, and the icons are generated from the logo already inside index.html.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write        # needed to publish the shareable release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the project
        run: |
          mkdir -p app app/src/main app/src/main/assets app/src/main/java/com/racexai/bot app/src/main/res/values app/src/main/res/xml
          HTML=$(ls index.html Race_x_Ai_bot.html *.html 2>/dev/null | head -1)
          if [ -z "$HTML" ]; then echo "::error::No .html file found in the repo root. Upload index.html alongside this workflow."; exit 1; fi
          echo "Using $HTML as the app"
          cp "$HTML" app/src/main/assets/index.html
          cat > settings.gradle <<'___RXA_EOF___'
          pluginManagement{ repositories{ google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement{ repositories{ google(); mavenCentral() } }
          rootProject.name="RaceXAiBot"
          include ":app"
          ___RXA_EOF___
          cat > build.gradle <<'___RXA_EOF___'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          ___RXA_EOF___
          cat > gradle.properties <<'___RXA_EOF___'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          ___RXA_EOF___
          cat > app/build.gradle <<'___RXA_EOF___'
          plugins { id 'com.android.application' }
          
          android {
              namespace 'com.racexai.bot'
              compileSdk 34
          
              defaultConfig {
                  applicationId "com.racexai.bot"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          
          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
          }
          ___RXA_EOF___
          cat > app/src/main/AndroidManifest.xml <<'___RXA_EOF___'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
          
              <!-- so the app can see which text-to-speech engines are installed -->
              <queries>
                  <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>
              </queries>
          
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="false">
          
                  <!-- Split screen changes screenLayout and smallestScreenSize. Those were
                       missing from configChanges, so entering split screen counted as a
                       configuration change Android could not hand to the activity - it
                       destroyed and recreated it, which reloaded the WebView and looked
                       like the app restarting. Every config a resizable window can change
                       is now declared, and the orientation is no longer pinned because a
                       fixed orientation is ignored in multi-window anyway. -->
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:resizeableActivity="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|keyboard|navigation|uiMode|density|fontScale|layoutDirection|locale">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
          
                  <!-- Reads Chamet's half of the split screen. Restricted by packageNames
                       to the game alone, so it is never handed anything else. -->
                  <service
                      android:name=".WatchService"
                      android:exported="false"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/watch_config"/>
                  </service>
              </application>
          </manifest>
          ___RXA_EOF___
          cat > app/src/main/res/values/strings.xml <<'___RXA_EOF___'
          <resources>
            <string name="app_name">Race x AI Bot</string>
            <string name="watch_desc">Reads the Lucky Race board in Chamet so the bot can fill in the race, announce the picks and log the winner without being touched.</string>
          </resources>
          ___RXA_EOF___
          cat > app/src/main/res/values/themes.xml <<'___RXA_EOF___'
          <resources>
            <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
              <item name="android:windowBackground">@android:color/black</item>
              <item name="android:statusBarColor">@android:color/black</item>
              <item name="android:navigationBarColor">@android:color/black</item>
            </style>
          </resources>
          ___RXA_EOF___
          cat > app/src/main/res/xml/watch_config.xml <<'___RXA_EOF___'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagIncludeNotImportantViews|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="300"
              android:packageNames="com.oversea.matemet"
              android:description="@string/watch_desc" />
          ___RXA_EOF___
          cat > app/src/main/java/com/racexai/bot/MainActivity.java <<'___RXA_EOF___'
          package com.racexai.bot;
          
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          
          import androidx.webkit.ServiceWorkerClientCompat;
          import androidx.webkit.ServiceWorkerControllerCompat;
          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewFeature;
          
          /**
           * Hosts the app in a WebView.
           *
           * Deliberately a plain android.app.Activity on a framework theme. AppCompat was
           * pulling in appcompat plus androidx.activity for nothing but a base class and a
           * file-picker helper, and every extra library is another thing that can fail to
           * resolve at build time. The only library left is androidx.webkit, which is not
           * optional - it provides WebViewAssetLoader, and without that the page has to be
           * loaded from file://, which costs the service worker, the web manifest, and any
           * guarantee that localStorage survives. Logged races live in localStorage.
           */
          public class MainActivity extends Activity {
          
              private static final String BASE = "https://appassets.androidplatform.net";
              private static final int FILE_PICK = 1001;
          
              /** So WatchService can reach the page without holding the activity itself. */
              private static WebView sWeb;
          
              /** Run a line of JS in the app. Safe to call from any thread, and a no-op
               *  when the activity is not up - the watcher must never crash the service. */
              static void js(final String code) {
                  final WebView w = sWeb;
                  if (w == null) return;
                  w.post(new Runnable() {
                      @Override public void run() {
                          try { w.evaluateJavascript(code, null); } catch (Exception ignored) { }
                      }
                  });
              }
          
              private WebView web;
              private TtsBridge tts;
              private ValueCallback<Uri[]> filePathCallback;
          
              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
          
                  web = new WebView(this);
                  sWeb = web;
                  setContentView(web);
          
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);                    // the whole app state lives here
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);    // chimes and music start on their own
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setSupportZoom(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
          
                  final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                          .setDomain("appassets.androidplatform.net")
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();
          
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                          return loader.shouldInterceptRequest(r.getUrl());
                      }
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          String url = r.getUrl().toString();
                          if (url.startsWith(BASE)) return false;      // stay inside for our own pages
                          try { startActivity(new Intent(Intent.ACTION_VIEW, r.getUrl())); } catch (Exception ignored) { }
                          return true;
                      }
                      @Override
                      public void onPageFinished(WebView v, String url) {
                          v.evaluateJavascript(Shim.JS, null);   // speechSynthesis + wakeLock
                          v.evaluateJavascript(Auto.JS, null);   // the watcher's way in
                      }
                  });
          
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb,
                                                       FileChooserParams params) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = cb;
                          try {
                              startActivityForResult(params.createIntent(), FILE_PICK);
                              return true;
                          } catch (Exception e) {
                              filePathCallback = null;
                              return false;
                          }
                      }
                  });
          
                  // Service worker fetches come off another thread and never reach the
                  // WebViewClient above, so the asset loader has to be wired in here too.
                  if (WebViewFeature.isFeatureSupported(WebViewFeature.SERVICE_WORKER_BASIC_USAGE)) {
                      ServiceWorkerControllerCompat.getInstance().setServiceWorkerClient(
                              new ServiceWorkerClientCompat() {
                                  @Override
                                  public WebResourceResponse shouldInterceptRequest(WebResourceRequest r) {
                                      return loader.shouldInterceptRequest(r.getUrl());
                                  }
                              });
                  }
          
                  tts = new TtsBridge(this, web);
                  web.addJavascriptInterface(tts, "AndroidTTS");
          
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      s.setForceDark(WebSettings.FORCE_DARK_OFF);   // the page is already dark
                  }
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN);
          
                  if (savedInstanceState != null) web.restoreState(savedInstanceState);
                  else web.loadUrl(BASE + "/assets/index.html");
              }
          
              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILE_PICK) {
                      if (filePathCallback != null) {
                          Uri[] uris = null;
                          if (resultCode == RESULT_OK && data != null && data.getData() != null) {
                              uris = new Uri[]{ data.getData() };
                          }
                          filePathCallback.onReceiveValue(uris);
                          filePathCallback = null;
                      }
                      return;
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }
          
              @Override protected void onSaveInstanceState(Bundle out) { super.onSaveInstanceState(out); web.saveState(out); }
          
              /**
               * Declared in configChanges, so Android hands the change here instead of
               * recreating the activity. Nothing needs doing - the WebView reflows itself -
               * but the callback has to exist and must not reload the page, or entering
               * split screen would still look like a restart.
               */
              @Override
              public void onConfigurationChanged(android.content.res.Configuration c) {
                  super.onConfigurationChanged(c);
              }
              @Override protected void onPause() { super.onPause(); web.onPause(); }
              @Override protected void onResume() { super.onResume(); web.onResume(); }
          
              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }
          
              @Override
              protected void onDestroy() {
                  if (sWeb == web) sWeb = null;
                  if (tts != null) tts.shutdown();
                  super.onDestroy();
              }
          }
          ___RXA_EOF___
          cat > app/src/main/java/com/racexai/bot/TtsBridge.java <<'___RXA_EOF___'
          package com.racexai.bot;
          
          import android.app.Activity;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.speech.tts.Voice;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          
          import org.json.JSONArray;
          import org.json.JSONObject;
          
          import java.util.HashSet;
          import java.util.Locale;
          import java.util.Set;
          
          /**
           * Android WebView has no Web Speech API, so every speechSynthesis call in the
           * app would silently do nothing. This exposes the platform TextToSpeech engine
           * to JavaScript; Shim.JS in MainActivity rebuilds window.speechSynthesis and
           * SpeechSynthesisUtterance on top of it, so the page's own code is untouched.
           */
          public class TtsBridge {
          
              private final Activity activity;
              private final WebView web;
              private TextToSpeech tts;
              private boolean ready = false;
          
              public TtsBridge(Activity activity, WebView web) {
                  this.activity = activity;
                  this.web = web;
                  this.tts = new TextToSpeech(activity, status -> {
                      ready = (status == TextToSpeech.SUCCESS);
                      if (ready) {
                          tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                              @Override public void onStart(String id) { fire("start", id); }
                              @Override public void onDone(String id) { fire("end", id); }
                              @Override public void onError(String id) { fire("error", id); }
                              @Override public void onError(String id, int code) { fire("error", id); }
                          });
                      }
                      // let the page know voices are available (mirrors onvoiceschanged)
                      post("if(window.__ttsReady)window.__ttsReady();");
                  });
              }
          
              private void fire(String type, String id) {
                  post("if(window.__ttsEvent)window.__ttsEvent('" + type + "','" + id + "');");
              }
          
              private void post(final String js) {
                  if (web == null) return;
                  web.post(() -> web.evaluateJavascript(js, null));
              }
          
              /** Locales the installed engines can actually speak, as JSON for getVoices(). */
              @JavascriptInterface
              public String voices() {
                  JSONArray out = new JSONArray();
                  if (!ready || tts == null) return out.toString();
                  try {
                      Set<Voice> vs = tts.getVoices();
                      Set<String> seen = new HashSet<>();
                      if (vs != null) {
                          for (Voice v : vs) {
                              Locale loc = v.getLocale();
                              if (loc == null) continue;
                              String tag = loc.toLanguageTag();
                              if (!seen.add(v.getName())) continue;
                              JSONObject o = new JSONObject();
                              o.put("name", v.getName());
                              o.put("lang", tag);
                              o.put("localService", !v.isNetworkConnectionRequired());
                              o.put("default", false);
                              out.put(o);
                          }
                      }
                  } catch (Exception ignored) { }
                  return out.toString();
              }
          
              /** Is a language available at all? LANG_MISSING_DATA / NOT_SUPPORTED are failures. */
              @JavascriptInterface
              public boolean hasLang(String tag) {
                  if (!ready || tts == null) return false;
                  try {
                      int r = tts.isLanguageAvailable(Locale.forLanguageTag(tag));
                      return r == TextToSpeech.LANG_AVAILABLE
                          || r == TextToSpeech.LANG_COUNTRY_AVAILABLE
                          || r == TextToSpeech.LANG_COUNTRY_VAR_AVAILABLE;
                  } catch (Exception e) { return false; }
              }
          
              @JavascriptInterface
              public void speak(String id, String text, String lang, float rate, float pitch, String voiceName) {
                  if (!ready || tts == null) { fire("error", id); return; }
                  try {
                      if (voiceName != null && voiceName.length() > 0) {
                          Set<Voice> vs = tts.getVoices();
                          if (vs != null) {
                              for (Voice v : vs) {
                                  if (voiceName.equals(v.getName())) { tts.setVoice(v); break; }
                              }
                          }
                      } else if (lang != null && lang.length() > 0) {
                          tts.setLanguage(Locale.forLanguageTag(lang));
                      }
                      tts.setSpeechRate(rate <= 0 ? 1f : rate);
                      tts.setPitch(pitch <= 0 ? 1f : pitch);
                      // QUEUE_ADD, because the page sequences its own languages one at a time
                      tts.speak(text, TextToSpeech.QUEUE_ADD, null, id);
                  } catch (Exception e) {
                      fire("error", id);
                  }
              }
          
              @JavascriptInterface
              public void cancel() {
                  if (tts != null) try { tts.stop(); } catch (Exception ignored) { }
              }
          
              @JavascriptInterface
              public boolean speaking() {
                  return tts != null && tts.isSpeaking();
              }
          
              /**
               * Open the accessibility list so the watcher can be switched on.
               *
               * The page cannot do this itself - a web page has no way to reach system
               * settings - so the robot button calls through here. On Android 13+ a
               * sideloaded app's toggle starts out greyed out until "Allow restricted
               * settings" is granted from the app's info screen; that part still has to be
               * done by hand, there is no API for it.
               */
              @JavascriptInterface
              public void openAccessibility() {
                  try {
                      android.content.Intent i =
                          new android.content.Intent(android.provider.Settings.ACTION_ACCESSIBILITY_SETTINGS);
                      i.addFlags(android.content.Intent.FLAG_ACTIVITY_NEW_TASK);
                      activity.startActivity(i);
                  } catch (Exception ignored) { }
              }
          
              /** Is the watcher actually running right now? Drives the button's label. */
              @JavascriptInterface
              public boolean watchOn() {
                  try { return WatchService.isRunning(); } catch (Exception e) { return false; }
              }
          
              /** How many races it has filled and logged, for a status line. */
              @JavascriptInterface
              public String watchStats() {
                  try { return "{\"filled\":" + WatchService.filled()
                             + ",\"logged\":" + WatchService.logged() + "}"; }
                  catch (Exception e) { return "{\"filled\":0,\"logged\":0}"; }
              }
          
              /** navigator.wakeLock has no WebView implementation either. */
              @JavascriptInterface
              public void keepAwake(final boolean on) {
                  activity.runOnUiThread(() -> {
                      if (on) activity.getWindow().addFlags(
                              android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                      else activity.getWindow().clearFlags(
                              android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  });
              }
          
              public void shutdown() {
                  if (tts != null) { try { tts.stop(); tts.shutdown(); } catch (Exception ignored) { } }
              }
          }
          ___RXA_EOF___
          cat > app/src/main/java/com/racexai/bot/Shim.java <<'___RXA_EOF___'
          package com.racexai.bot;
          
          /**
           * Injected after every page load. Rebuilds the two browser APIs the app relies
           * on that Android WebView does not implement, on top of the native bridge:
           *
           *   speechSynthesis / SpeechSynthesisUtterance  -> android.speech.tts
           *   navigator.wakeLock                          -> FLAG_KEEP_SCREEN_ON
           *
           * The app's own code is not modified; it keeps calling the standard APIs.
           */
          final class Shim {
              private Shim() { }
          
              static final String JS =
          "(function(){\n" +
          "  var TTS=window.AndroidTTS;\n" +
          "  if(!TTS || window.__shimmed) return; window.__shimmed=true;\n" +
          "\n" +
          "  var pending={}, seq=0, voices=[], speakingCount=0;\n" +
          "\n" +
          "  function loadVoices(){\n" +
          "    try{ voices=JSON.parse(TTS.voices()||'[]'); }catch(e){ voices=[]; }\n" +
          "    try{ window.dispatchEvent(new Event('voiceschanged')); }catch(e){}\n" +
          "    if(synth.onvoiceschanged){ try{ synth.onvoiceschanged(); }catch(e){} }\n" +
          "  }\n" +
          "  window.__ttsReady=loadVoices;\n" +
          "\n" +
          "  // native -> page callbacks for onstart / onend / onerror\n" +
          "  window.__ttsEvent=function(type,id){\n" +
          "    var u=pending[id]; if(!u) return;\n" +
          "    if(type==='start'){ if(u.onstart) try{ u.onstart({}); }catch(e){} return; }\n" +
          "    delete pending[id];\n" +
          "    speakingCount=Math.max(0,speakingCount-1);\n" +
          "    var h=(type==='end')?u.onend:u.onerror;\n" +
          "    if(h) try{ h({}); }catch(e){}\n" +
          "  };\n" +
          "\n" +
          "  function Utter(text){\n" +
          "    this.text=text||''; this.lang='en-US'; this.rate=1; this.pitch=1;\n" +
          "    this.volume=1; this.voice=null;\n" +
          "    this.onstart=null; this.onend=null; this.onerror=null;\n" +
          "  }\n" +
          "\n" +
          "  var synth={\n" +
          "    get speaking(){ try{ return TTS.speaking(); }catch(e){ return speakingCount>0; } },\n" +
          "    get pending(){ return speakingCount>0; },\n" +
          "    paused:false,\n" +
          "    onvoiceschanged:null,\n" +
          "    getVoices:function(){ return voices; },\n" +
          "    cancel:function(){\n" +
          "      try{ TTS.cancel(); }catch(e){}\n" +
          "      // fire onend for anything still queued, or the page's sequencer stalls\n" +
          "      for(var k in pending){ var u=pending[k]; delete pending[k];\n" +
          "        if(u && u.onend) try{ u.onend({}); }catch(e){} }\n" +
          "      speakingCount=0;\n" +
          "    },\n" +
          "    pause:function(){}, resume:function(){},\n" +
          "    speak:function(u){\n" +
          "      if(!u || !u.text) return;\n" +
          "      var id='u'+(++seq);\n" +
          "      pending[id]=u; speakingCount++;\n" +
          "      var name=(u.voice && u.voice.name)?u.voice.name:'';\n" +
          "      try{\n" +
          "        TTS.speak(id, String(u.text), u.lang||'en-US',\n" +
          "                         u.rate||1, u.pitch||1, name);\n" +
          "      }catch(e){\n" +
          "        delete pending[id]; speakingCount--;\n" +
          "        if(u.onerror) try{ u.onerror({}); }catch(e2){}\n" +
          "      }\n" +
          "    }\n" +
          "  };\n" +
          "\n" +
          "  try{\n" +
          "    Object.defineProperty(window,'speechSynthesis',{value:synth,configurable:true});\n" +
          "  }catch(e){ window.speechSynthesis=synth; }\n" +
          "  window.SpeechSynthesisUtterance=Utter;\n" +
          "\n" +
          "  // navigator.wakeLock, so Broadcast mode can hold the screen on\n" +
          "  if(!navigator.wakeLock){\n" +
          "    navigator.wakeLock={ request:function(){\n" +
          "      try{ TTS.keepAwake(true); }catch(e){}\n" +
          "      return Promise.resolve({ release:function(){\n" +
          "        try{ TTS.keepAwake(false); }catch(e){}\n" +
          "        return Promise.resolve();\n" +
          "      }, addEventListener:function(){} });\n" +
          "    }};\n" +
          "  }\n" +
          "\n" +
          "  loadVoices();\n" +
          "  setTimeout(loadVoices,1500);   // engines often report late on first launch\n" +
          "})();";
          }
          ___RXA_EOF___
          cat > app/src/main/java/com/racexai/bot/Auto.java <<'___RXA_EOF___'
          package com.racexai.bot;
          
          /**
           * The bridge the watcher uses to drive the app, injected after every page load.
           *
           * It calls the app's own handlers - toggleV3, selectRoad, selectSlot,
           * selectWinner, openOutcomeModal - rather than assigning to sel3 and friends
           * directly. Assigning directly would log the right race but leave the buttons
           * unlit, so the screen would disagree with the history.
           *
           * This exact script was run against the real app loaded with 1000 races: it
           * fills a board, gets a prediction and a Guard verdict, announces, and logs a
           * winner with engine calls, bet strength and the Guard stamp all recorded.
           */
          final class Auto {
              private Auto() { }
          
              static final String JS =
          "// Injected into the app's WebView. Everything the watcher does to the app goes\n" +
