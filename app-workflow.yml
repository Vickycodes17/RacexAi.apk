                      // by the slot THAT board reported, not this frame's. Once the race
                      // is running every track carries a sign, so the current frame's slot
                      // is whichever one the scan happened to see last, and using it drops
                      // a genuinely hidden surface while reporting the revealed one back
                      // as a discovery.
                      List<String> rest = new ArrayList<>(f.namedRoads);
                      rest.remove(filledSlot - 1);
                      if (rest.size() == 2) {
                          hidA = rest.get(0); hidB = rest.get(1);
                          listener.hiddenRoads(hidA, hidB);
