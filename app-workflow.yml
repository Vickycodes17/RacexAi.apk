          package com.racexai.bot;
          
          /**
           * Reads the three road surfaces off a picture of the race.
           *
           * Chamet reveals the two hidden surfaces when the race starts, but reveals them
           * as a PICTURE - the track signs are removed from the screen entirely, so there
           * is no text to read. This finds the track in a screenshot and reports the
           * average colour of each of the three segments. Naming them is left to the app,
           * which learns what each surface looks like from races where the answer is
           * already known.
           *
           * Two anchors, both chosen so nothing depends on what colour a road happens to
           * be - which matters, because one of the six is black and another is white-ish
           * sand:
           *
           *   Vertically, the track sits between two red-and-white striped borders. Red
           *   that saturated appears nowhere else on the track itself. The starting
           *   lights are red too, so the pair of borders with the biggest gap between
           *   them is the one that brackets the track.
           *
           *   Horizontally, the track ends in black-and-white chequered edges. Those are
           *   found by variance rather than by colour: read a column downwards and a
           *   chequered one swings between black and white while any road, black ones
           *   included, stays roughly constant.
           *
           * Verified against a real 1080x2400 screenshot of a race whose revealed road
           * was Bumpy in slot 1: it locates the track at y 1868-2242, x 60-1049, and
           * reports Bumpy, Bumpy, Desert. The first of those is the one already known, so
           * it doubles as a check that the reading is trustworthy at all.
           */
          public class TrackReader {
          
              /** Average colour of one segment, plus how much of it looks like paint. */
              public static class Seg {
                  public final int r, g, b;
                  /**
                   * How much of the segment is markings, and what colour they are.
                   *
                   * Highway and Expressway are the same grey; what separates them is a
                   * yellow centre line against a white one. So rather than hunting for
                   * one specific yellow - which the light planks on Bumpy also happen to
                   * match - this measures the pixels that stand out as brighter than the
                   * surface around them, and how far towards red they lean. A white line
                   * gives a lean of about zero, a yellow one gives a large positive.
                   */
                  public final int bright;   // fraction x1000 brighter than the surface
                  public final int lean;     // mean (red - blue) of those, 0 for white
          
                  Seg(int r, int g, int b, int bright, int lean) {
                      this.r = r; this.g = g; this.b = b; this.bright = bright; this.lean = lean;
                  }
                  @Override public String toString() {
                      return "(" + r + "," + g + "," + b + ") bright=" + bright + " lean=" + lean;
                  }
              }
          
              public static class Read {
                  public Seg[] segs;          // three, left to right; null if not found
                  public int trackTop, trackBottom, trackLeft, trackRight;
                  public String why = "";     // why it found nothing, when it finds nothing
                  public boolean ok() { return segs != null && segs.length == 3; }
              }
          
              public interface Pixels {
                  int width();
                  int height();
                  /** 0xRRGGBB at x,y */
                  int rgb(int x, int y);
              }
          
              private static int R(int c) { return (c >> 16) & 0xFF; }
              private static int G(int c) { return (c >> 8) & 0xFF; }
              private static int B(int c) { return c & 0xFF; }
          
              /** The saturated red of the border stripes, and of nothing else on a road. */
              private static boolean isRed(int c) {
                  int r = R(c), g = G(c), b = B(c);
                  return r > 190 && g < 130 && b < 130 && r - g > 70;
              }
          
              public static Read read(Pixels px) {
                  Read out = new Read();
                  final int W = px.width(), H = px.height();
                  if (W < 200 || H < 400) { out.why = "screen too small"; return out; }
          
                  // ── the two striped borders, and the gap between them ──
                  int[] starts = new int[64], ends = new int[64];
                  int n = 0, runStart = -1, lastHit = -1;
                  for (int y = (int) (H * 0.35); y < H - 6; y += 3) {
                      int red = 0, tot = 0;
                      for (int x = 0; x < W; x += 4) { tot++; if (isRed(px.rgb(x, y))) red++; }
                      boolean hit = tot > 0 && red * 100 / tot > 18;
                      if (hit) {
                          if (runStart < 0 || y - lastHit > 15) {
                              if (runStart >= 0 && n < 64) { starts[n] = runStart; ends[n] = lastHit; n++; }
                              runStart = y;
                          }
                          lastHit = y;
                      }
                  }
                  if (runStart >= 0 && n < 64) { starts[n] = runStart; ends[n] = lastHit; n++; }
                  if (n < 2) { out.why = "no striped track border found"; return out; }
          
                  int bestGap = -1, y0 = 0, y1 = 0;
                  for (int i = 0; i + 1 < n; i++) {
                      int gap = starts[i + 1] - ends[i];
                      if (gap > bestGap) { bestGap = gap; y0 = ends[i]; y1 = starts[i + 1]; }
                  }
                  y0 += 8; y1 -= 8;
                  if (y1 - y0 < 60) { out.why = "track band too thin"; return out; }
          
                  // ── the chequered ends, by variance rather than by colour ──
                  int x0 = edge(px, y0, y1, true, W);
                  int x1 = edge(px, y0, y1, false, W);
                  if (x1 - x0 < W / 3) { out.why = "track too narrow"; return out; }
          
                  out.trackTop = y0; out.trackBottom = y1; out.trackLeft = x0; out.trackRight = x1;
          
                  // ── the three segments ──
                  Seg[] segs = new Seg[3];
                  for (int k = 0; k < 3; k++) {
                      int cx = x0 + (x1 - x0) * (1 + 2 * k) / 6;
                      int lo = Math.max(0, cx - 55), hi = Math.min(W, cx + 55);
                      long sr = 0, sg = 0, sb = 0; int cnt = 0;
                      for (int x = lo; x < hi; x += 2)
                          for (int y = y0 + 15; y < y1 - 15; y += 4) {
                              int c = px.rgb(x, y);
                              sr += R(c); sg += G(c); sb += B(c); cnt++;
                          }
                      if (cnt == 0) { out.why = "nothing to sample"; return out; }
                      int mr = (int) (sr / cnt), mg = (int) (sg / cnt), mb = (int) (sb / cnt);
                      int mv = (mr + mg + mb) / 3;
          
                      // second pass: the markings, now that the surface's own level is known
                      int nb = 0; long leanSum = 0;
                      for (int x = lo; x < hi; x += 2)
                          for (int y = y0 + 15; y < y1 - 15; y += 4) {
                              int c = px.rgb(x, y);
                              if ((R(c) + G(c) + B(c)) / 3 > mv + 35) { nb++; leanSum += R(c) - B(c); }
                          }
                      segs[k] = new Seg(mr, mg, mb, nb * 1000 / cnt, nb == 0 ? 0 : (int) (leanSum / nb));
                  }
                  out.segs = segs;
                  return out;
              }
          
              /** Walk in from one side until the column stops swinging black-to-white. */
              private static int edge(Pixels px, int y0, int y1, boolean fromLeft, int W) {
                  int run = 0;
                  // A fixed, fine stride on purpose. Scaling it to the band height left
                  // only four samples per column, and four samples cannot tell a chequered
                  // column from a plain one - the edges came in 26px wide on both sides.
                  int stride = Math.max(2, (y1 - y0) / 40);
                  for (int i = 0; i < W / 2; i += 2) {
                      int x = fromLeft ? i : W - 1 - i;
                      long s = 0, s2 = 0; int c = 0;
                      for (int y = y0; y < y1; y += stride) {
                          int v = R(px.rgb(x, y)); s += v; s2 += (long) v * v; c++;
                      }
                      if (c == 0) break;
                      double mean = (double) s / c, var = (double) s2 / c - mean * mean;
                      run = (var < 900) ? run + 1 : 0;
                      if (run >= 14) return fromLeft ? x - 26 : x + 26;
                  }
                  return fromLeft ? 0 : W - 1;
              }
          }
