          package com.racexai.bot;
          
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;
          
          /**
           * Reads the road surfaces off a picture of the race.
           *
           * Chamet reveals the two hidden surfaces when the race starts, but reveals them
           * as a PICTURE - the track signs are removed from the screen entirely, so there
           * is no text to read.
           *
           * WHAT THIS GOT WRONG THE FIRST TIME: it assumed the three segments were equal
           * thirds and sampled at 1/6, 1/2 and 5/6 of the track. They are not. Measured
           * off a real race, the three ran 22%, 50% and 28% - a segment can be less than
           * half the width of its neighbour, and fixed sampling positions land in the
           * wrong segment as soon as the first one is narrow. So the boundaries are found
           * rather than assumed.
           *
           * They are found on texture as well as colour, because one of the real
           * boundaries is invisible to colour alone: Highway and Potholes are the same
           * grey, and what separates them is that one has holes in it.
           *
           * Two anchors locate the track, both chosen so nothing depends on what colour a
           * road happens to be - which matters, because one of the six is black:
           *
           *   Vertically, the track sits between two red-and-white striped borders, and
           *   the pair with the biggest plausible gap between them brackets it. The WHOLE
           *   screen is searched, not the lower part: in split screen the game sits at the
           *   top, and looking only below the middle finds nothing at all.
           *
           *   Horizontally, the track ends in black-and-white chequered edges, found by
           *   variance rather than colour: read a column downwards and a chequered one
           *   swings between black and white while any road stays roughly constant.
           *
           * Every column is measured by its MEDIAN, so the three cars driving over the
           * track do not drag a segment's colour towards whatever they are painted.
           */
          public class TrackReader {
          
              /** One stretch of track that reads as a single surface. */
              public static class Run {
                  public final int r, g, b;
                  /** pixels clearly warmer than neutral, per thousand - the centre line */
                  public final int yellow;
                  /** pixels clearly darker than the surface, per thousand - the holes */
                  public final int dark;
                  /** how much of the whole track this stretch covers, as a percentage */
                  public final int pct;
          
                  Run(int r, int g, int b, int yellow, int dark, int pct) {
                      this.r = r; this.g = g; this.b = b;
                      this.yellow = yellow; this.dark = dark; this.pct = pct;
                  }
                  @Override public String toString() {
                      return "(" + r + "," + g + "," + b + ") y" + yellow + " d" + dark + " " + pct + "%";
                  }
              }
          
              public static class Read {
                  /** the stretches, left to right; between 1 and 3 of them */
                  public List<Run> runs;
                  public int trackTop, trackBottom, trackLeft, trackRight;
                  public String why = "";
                  public boolean ok() { return runs != null && runs.size() >= 1 && runs.size() <= 3; }
              }
          
              public interface Pixels {
                  int width();
                  int height();
                  /** 0xRRGGBB at x,y */
                  int rgb(int x, int y);
              }
          
              private static int R(int c) { return (c >> 16) & 0xFF; }
              private static int G(int c) { return (c >> 8) & 0xFF; }
              private static int B(int c) { return c & 0xFF; }
          
              /** The saturated red of the border stripes, and of nothing else on a road. */
              private static boolean isRed(int c) {
                  int r = R(c), g = G(c), b = B(c);
                  return r > 190 && g < 130 && b < 130 && r - g > 70;
              }
          
              /** How vivid a colour is, 0..100. The cars are; the roads are not. */
              private static int sat(int c) {
                  int mx = Math.max(R(c), Math.max(G(c), B(c)));
                  int mn = Math.min(R(c), Math.min(G(c), B(c)));
                  return mx == 0 ? 0 : (mx - mn) * 100 / mx;
              }
          
              /** A column, measured so that a car sitting on it does not matter. */
              private static class Col {
                  int r, g, b, yellow, dark;
              }
          
              public static Read read(Pixels px) {
                  Read out = new Read();
                  final int W = px.width(), H = px.height();
                  if (W < 200 || H < 400) { out.why = "screen too small"; return out; }
          
                  // ── the striped borders, searched over the WHOLE screen ──
                  List<int[]> bands = new ArrayList<>();
                  int runStart = -1, lastHit = -1;
                  for (int y = 0; y < H - 6; y += 3) {
                      int red = 0, tot = 0;
                      for (int x = 0; x < W; x += 4) { tot++; if (isRed(px.rgb(x, y))) red++; }
                      boolean hit = tot > 0 && red * 100 / tot > 18;
                      if (hit) {
                          if (runStart < 0 || y - lastHit > 15) {
                              if (runStart >= 0) bands.add(new int[]{ runStart, lastHit });
                              runStart = y;
                          }
                          lastHit = y;
                      }
                  }
                  if (runStart >= 0) bands.add(new int[]{ runStart, lastHit });
                  if (bands.size() < 2) { out.why = "no striped track border found"; return out; }
          
                  int bestGap = -1, y0 = 0, y1 = 0;
                  for (int i = 0; i + 1 < bands.size(); i++) {
                      int gap = bands.get(i + 1)[0] - bands.get(i)[1];
