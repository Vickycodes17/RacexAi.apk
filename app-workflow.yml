          // Race x AI Bot — service worker.
          // Bump CACHE when you ship a new index.html, or phones keep serving the old one.
          const CACHE = 'racexai-v1';
          const ASSETS = ['./', './index.html', './manifest.json',
                          './icon-192.png', './icon-512.png', './icon-maskable-512.png'];
          
          self.addEventListener('install', e => {
            e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS)).then(() => self.skipWaiting()));
          });
          
          self.addEventListener('activate', e => {
            e.waitUntil(
              caches.keys()
                .then(keys => Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k))))
                .then(() => self.clients.claim())
            );
          });
          
          // The page itself is network-first, so a new build reaches you as soon as you
          // are online; the cached copy is the fallback that keeps the app usable offline.
          // Everything else is cache-first, since icons and the manifest rarely change.
          self.addEventListener('fetch', e => {
            const req = e.request;
            if (req.method !== 'GET') return;
            const url = new URL(req.url);
            if (url.origin !== location.origin) return;   // never touch Supabase or the CDN
          
            if (req.mode === 'navigate' || url.pathname.endsWith('.html')) {
              e.respondWith(
                fetch(req)
                  .then(res => {
                    const copy = res.clone();
                    caches.open(CACHE).then(c => c.put(req, copy));
                    return res;
                  })
                  .catch(() => caches.match(req).then(r => r || caches.match('./index.html')))
              );
              return;
            }
            e.respondWith(caches.match(req).then(r => r || fetch(req)));
          });
