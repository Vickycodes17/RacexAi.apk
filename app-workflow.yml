                      if (gap < H * 0.05 || gap > H * 0.40) continue;
                      if (gap > bestGap) { bestGap = gap; y0 = bands.get(i)[1]; y1 = bands.get(i + 1)[0]; }
                  }
                  if (bestGap < 0) { out.why = "no plausible track band"; return out; }
                  y0 += 8; y1 -= 8;
          
                  // ── the chequered ends ──
                  int x0 = edge(px, y0, y1, true, W);
                  int x1 = edge(px, y0, y1, false, W);
                  if (x1 - x0 < W / 3) { out.why = "track too narrow"; return out; }
          
                  out.trackTop = y0; out.trackBottom = y1; out.trackLeft = x0; out.trackRight = x1;
          
                  // ── measure every column ──
                  final int STEP = 4;
                  List<Col> cols = new ArrayList<>();
                  for (int x = x0; x < x1; x += STEP) {
                      Col c = column(px, x, y0, y1);
                      if (c != null) cols.add(c);
                  }
                  if (cols.size() < 12) { out.why = "track too thin to measure"; return out; }
          
                  // ── cut it where the surface actually changes ──
                  //
                  // Every candidate split is scored by comparing a window of track on each
                  // side of it, rather than one column against the next - a boundary is a
                  // few pixels wide and gradual, and column-to-column differences are
                  // dominated by texture noise. The strongest split is taken if it is
                  // strong enough, then each side is scored again. At most two splits,
                  // because there are at most three surfaces.
                  List<int[]> segs = new ArrayList<>();
                  segs.add(new int[]{ 0, cols.size() - 1 });
                  for (int pass = 0; pass < 2; pass++) {
                      int bestScore = 0, bestSeg = -1, bestAt = -1;
                      for (int si = 0; si < segs.size(); si++) {
                          int lo = segs.get(si)[0], hi = segs.get(si)[1];
                          int win = Math.max(4, cols.size() / 10);
                          int margin = Math.max(3, cols.size() * 8 / 100);
                          for (int cut = lo + margin; cut <= hi - margin; cut++) {
                              Col L = mean(cols, new int[]{ Math.max(lo, cut - win), cut - 1 });
                              Col Rr = mean(cols, new int[]{ cut, Math.min(hi, cut + win - 1) });
                              int sc = dist(L, Rr);
                              if (sc > bestScore) { bestScore = sc; bestSeg = si; bestAt = cut; }
                          }
                      }
                      if (bestSeg < 0 || bestScore < 60) break;
                      int lo = segs.get(bestSeg)[0], hi = segs.get(bestSeg)[1];
                      segs.set(bestSeg, new int[]{ lo, bestAt - 1 });
                      segs.add(bestSeg + 1, new int[]{ bestAt, hi });
                  }
          
                  int total = cols.size();
                  List<Run> runs = new ArrayList<>();
                  for (int[] sg : segs) {
                      Col m = mean(cols, sg);
                      int w = sg[1] - sg[0] + 1;
                      runs.add(new Run(m.r, m.g, m.b, m.yellow, m.dark, w * 100 / total));
                  }
                  out.runs = runs;
                  return out;
              }
          
              /** Median colour of one column, plus how much of it is line and how much hole. */
              private static Col column(Pixels px, int x, int y0, int y1) {
                  List<Integer> rs = new ArrayList<>(), gs = new ArrayList<>(), bs = new ArrayList<>();
                  for (int y = y0; y < y1; y += 5) {
                      int c = px.rgb(x, y);
                      rs.add(R(c)); gs.add(G(c)); bs.add(B(c));
                  }
                  if (rs.size() < 4) return null;
                  Collections.sort(rs); Collections.sort(gs); Collections.sort(bs);
                  Col c = new Col();
                  c.r = rs.get(rs.size() / 2); c.g = gs.get(gs.size() / 2); c.b = bs.get(bs.size() / 2);
                  int mv = (c.r + c.g + c.b) / 3, yel = 0, drk = 0, n = 0;
                  for (int y = y0; y < y1; y += 3) {
                      int p = px.rgb(x, y); n++;
                      if (R(p) - B(p) > 70 && R(p) > 140) yel++;
                      // neutral only: a car is vivid, and would otherwise read as holes
                      if ((R(p) + G(p) + B(p)) / 3 < mv - 28 && sat(p) < 22) drk++;
                  }
                  c.yellow = n == 0 ? 0 : yel * 1000 / n;
                  c.dark = n == 0 ? 0 : drk * 1000 / n;
                  return c;
              }
          
              /**
               * How far apart two stretches of track look. COLOUR ONLY.
               *
               * Texture was in here and it was a mistake. Potholes are scattered blobs
               * with bare road between them, so the hole count rises and falls all the way
               * along a single segment - and a run of clean tarmac at the start of one
               * looked exactly like a boundary. On a real frame that split one Potholes
               * segment in two and invented a Highway that was never in the race.
               *
               * Texture still earns its keep, but for naming a stretch rather than finding
               * its edges: the holes are what tell Potholes from the other greys once the
               * stretch has been cut out. Edges come from colour, which does not flicker.
               */
              private static int dist(Col a, Col b) {
                  return Math.abs(a.r - b.r) + Math.abs(a.g - b.g) + Math.abs(a.b - b.b);
              }
          
              private static Col mean(List<Col> cols, int[] seg) {
                  long r = 0, g = 0, b = 0, y = 0, d = 0; int n = 0;
                  for (int i = seg[0]; i <= seg[1]; i++) {
                      Col c = cols.get(i); r += c.r; g += c.g; b += c.b; y += c.yellow; d += c.dark; n++;
