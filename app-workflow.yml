          package com.racexai.bot;
          
          import java.util.ArrayList;
          import java.util.List;
          
          /**
           * Decides when to act on what it is shown. No Android imports, so the whole
           * sequence can be replayed against recorded frames on a desktop rather than
           * debugged on a phone.
           *
           * The loop, in the game's own terms:
           *
           *   BETTING opens with a readable board -> fill it into the app and announce.
           *           Only once per race: the board is re-read every frame while the
           *           countdown ticks, and re-filling every time would re-announce over
           *           and over.
           *   RACING  the board vanishes from the tree entirely - vehicle names included -
           *           so nothing can be re-read here. The app keeps what it was given.
           *   RESULT  "ORV won, Next 10 s" appears and stays about ten seconds. Log it
           *           once, then forget the board so the next round fills cleanly even if
           *           it happens to have the identical line-up.
           */
          public class RaceWatcher {
          
              public interface Listener {
                  /** cars left-to-right, road name, slot 1..3 as drawn on screen */
                  void fillAndSpeak(List<String> cars, String road, int slot);
                  /**
                   * Live odds and crowd stake per vehicle, plus the three track signs as
                   * they actually appear, recorded alongside the race. The signs are kept
                   * because two of them read "???" and whether the real surface is hidden
                   * behind that placeholder decides whether ~94% is reachable or ~80% is
                   * the ceiling - a question worth answering from data.
                   */
                  void raceMeta(List<String> odds, List<String> bets, List<String> signs);
                  /**
                   * The two surfaces the board kept back, once the race has started and
                   * they are finally drawn. They arrive far too late to bet on - the point
                   * is the history. Each race teaches the model three surface facts
                   * instead of one, and that is worth about five points of accuracy.
                   */
                  void hiddenRoads(String a, String b);
                  /**
                   * What a frame contained while the race was running, once per race.
                   * Reading the hidden surfaces from labels cannot work - the race screen
                   * has no labels - so this reports what IS there, to settle whether the
                   * game tells a screen reader anything a person cannot see.
                   */
                  void probe(String summary);
                  /**
                   * Time to photograph the track. Called once per race, while it runs -
                   * the only window in which the two hidden surfaces are on screen at all.
                   */
                  void grabTrack();
                  void logWinner(String winner);
              }
          
              private final Listener listener;
          
              private String filledKey;    // the board currently sitting in the app
              private boolean armed;       // that board has a race running on it
              private int filled = 0, logged = 0;
              private String hidA, hidB;   // the two surfaces, once the race reveals them
              private int filledSlot = -1; // which track was revealed on the board we filled
              private boolean probed;      // this race has already been reported on
          
          
              public RaceWatcher(Listener listener) { this.listener = listener; }
          
              public int filledCount() { return filled; }
              public int loggedCount() { return logged; }
          
              public void feed(String dump) {
                  // Only frames showing the Lucky Race board count for anything.
                  if (dump.indexOf("race_game_bg") < 0 && dump.indexOf("gameBetView") < 0) return;
          
                  RaceReader.Frame f = RaceReader.parse(dump);
          
                  if (f.betOpen) {
                      if (f.cars.size() != 3 || f.road == null || f.slot < 1) return;   // half-drawn
                      String key = f.cars.toString() + "|" + f.road + "|" + f.slot;
                      if (key.equals(filledKey)) return;                                // same board, already done
                      filledKey = key;
                      armed = true;
                      filled++;
                      hidA = hidB = null;                                // new race, forget the last one
                      filledSlot = f.slot;
                      probed = false;
                      listener.fillAndSpeak(f.cars, f.road, f.slot);
                      listener.raceMeta(f.odds, f.bets, f.signs);
                      return;
                  }
          
                  // Racing. Report what is on screen, once, so it can be established from
                  // a real frame whether anything here names the two surfaces. On the
                  // builds seen so far nothing does - the race screen drops the track
                  // signs entirely and draws the surfaces as pictures - which is why the
                  // capture below has never fired.
                  if (armed && !probed && !f.betOpen && f.winner == null) {
                      probed = true;
